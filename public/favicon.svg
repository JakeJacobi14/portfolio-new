<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- One bright star, as in the constellation (DESIGN.md 8): a warm star core with its
       soft halo (peaking at 28%), on the page background. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F0E2CB" stop-opacity="0.28" />
      <stop offset="1" stop-color="#F0E2CB" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#171715" />
  <circle cx="32" cy="32" r="29" fill="url(#halo)" />
  <circle cx="32" cy="32" r="9" fill="#F0E2CB" />
</svg>
