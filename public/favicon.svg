<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A shooting star across the night (DESIGN.md 8): a streak in the text color fading
       in toward a warm star head with its halo, a few faint stars, on the page background. -->
  <defs>
    <linearGradient id="streak" x1="5" y1="57" x2="44" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8E5DF" stop-opacity="0" />
      <stop offset="1" stop-color="#E8E5DF" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F0E2CB" stop-opacity="0.5" />
      <stop offset="1" stop-color="#F0E2CB" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#171715" />
  <circle cx="13" cy="14" r="1.8" fill="#9C978E" />
  <circle cx="53" cy="47" r="1.8" fill="#9C978E" />
  <circle cx="25" cy="52" r="1.4" fill="#9C978E" />
  <path d="M5 57 L42 22" stroke="url(#streak)" stroke-width="5" stroke-linecap="round" />
  <circle cx="44" cy="20" r="16" fill="url(#halo)" />
  <circle cx="44" cy="20" r="7" fill="#F0E2CB" />
</svg>
