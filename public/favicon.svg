<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- One bright star, as in the constellation (DESIGN.md 8): a warm star core with its
       soft halo, on transparent (a dark square made Safari draw a light outline). A thin
       ring in the page background color keeps it visible on light tab bars. -->
  <defs>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#F0E2CB" stop-opacity="0.28" />
      <stop offset="1" stop-color="#F0E2CB" stop-opacity="0" />
    </radialGradient>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#halo)" />
  <circle cx="32" cy="32" r="19" fill="#F0E2CB" stroke="#171715" stroke-width="4" />
</svg>
